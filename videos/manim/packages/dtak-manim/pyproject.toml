[project]
name = "dtak-manim"
version = "0.2.0"
description = "DTAK identity, beats + voiceover workflow and reusable components for manim videos"
requires-python = ">=3.14"
dependencies = [
    "manim>=0.22.1",
    "manim-voiceover>=0.4.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
gtts = ["manim-voiceover[gtts]"]

[project.scripts]
dtak = "dtak_manim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtak_manim"]
